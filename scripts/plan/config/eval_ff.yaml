# Feed-forward policy evaluation (python scripts/plan/eval_ff.py [key=value ...])
hydra:
  output_subdir: null
  run:
    dir: .

cache_dir: null
dataset_name: findgoal         # the env (and its settings) of this dataset is evaluated
policy: gcbc_findgoal          # a checkpoint in <cache_dir>/checkpoints: scripts/train/gcrl.py, mamba.py, omnivla.py, commnet.py or mappo.py
temperature: 0.0               # action sampling temperature (0: the most likely action; OGBench uses 0.3 on Powderworld);
                               # MAMBA, CommNet, MAPPO: 0 = most likely action, otherwise sampled
seed: 0
goal_modalities: [pose, image] # OmniVLA, GCCommNet: the goals given to the model (any non-empty subset of pose, image)
comm: null                     # CommNet: comm-core links when acting (null: the ones it was trained with), e.g. another
                               # channel: {_target_: stable_marl.wm.commnet.NetworkLinks, channel: {_target_: comm_core.ErasureChannel, loss_rate: 0.5}}

eval:
  episodes: 20
  seed: 100000                 # episodes unseen in the dataset
  num_envs: 2
  max_episode_steps: 40
  # evaluate under other settings than the training data's (see scripts/examples/generalization.py):
  env_kwargs: {}               # env arguments, e.g. {num_obstacles: 3}
  options: null                # reset options, e.g. {variation_values: {wall.color: 0}} or {variation: [agent.color]}
  wrappers: []                 # visual wrappers, e.g. [{_target_: stable_marl.wrappers.NoiseWrapper, _partial_: true, std: 30}]
  video_episodes: 2            # episodes saved as videos (0: none)

output:
  dir: null                    # default: next to the checkpoint
  filename: findgoal_results.txt
