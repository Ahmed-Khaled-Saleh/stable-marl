# Build the Docker images (docker/Dockerfile), check them and push them to the GitHub Container Registry:
#   ghcr.io/<owner>/stable-marl:main              (and :main-<commit>)
#   ghcr.io/<owner>/stable-marl:robofactory-data  (and :robofactory-data-<commit>)
# On HPC clusters: apptainer pull docker://ghcr.io/<owner>/stable-marl:main (see docker/README.md).
name: Docker images

on:
  push:
    branches: [master]
    paths: ['docker/**', 'pyproject.toml', 'stable_marl/**', 'scripts/**', '.github/workflows/docker.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [main, robofactory-data]
    steps:
      - name: Free disk space (the main image holds the CUDA libraries of torch and JAX)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - name: Image name (lowercase owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stable-marl" >> "$GITHUB_ENV"

      - name: Build
        run: docker build -f docker/Dockerfile --target ${{ matrix.target }} -t $IMAGE:${{ matrix.target }} .

      - name: Check (main)
        if: matrix.target == 'main'
        run: |
          docker run --rm $IMAGE:main python -c "
          import numpy, torch, jax, mani_skill, vmas, stable_marl
          from stable_marl.wm import gcrl, mamba
          assert numpy.__version__ >= '2', numpy.__version__
          print('numpy', numpy.__version__, 'torch', torch.__version__, 'jax', jax.__version__)"
          docker run --rm $IMAGE:main python tests/test_env_families.py

      - name: Check (robofactory-data, with the expert on the CPU renderer)
        if: matrix.target == 'robofactory-data'
        run: docker run --rm $IMAGE:robofactory-data python scripts/examples/robofactory_tasks.py

      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag $IMAGE:${{ matrix.target }} $IMAGE:${{ matrix.target }}-${GITHUB_SHA::7}
          docker push $IMAGE:${{ matrix.target }}
          docker push $IMAGE:${{ matrix.target }}-${GITHUB_SHA::7}
