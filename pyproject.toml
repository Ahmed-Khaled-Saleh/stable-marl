[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-marl"
dynamic = ["version"]
description = "Fast and flexible multi-agent gridworld reinforcement learning environments."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Ahmed-Khaled-Saleh", email = "ahmedkhaledsaleh11@gmail.com"}]
keywords = ['reinforcement-learning', 'multi-agent', 'marl', 'gridworld', 'gymnasium', 'pettingzoo', 'torchrl']
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    'aenum',
    'numpy',
    'numba',
    'fastcore',
    'gymnasium',
    'pygame',
    'hydra-core',           # stable_marl.configs, stable_marl.envs.registry.make_env
    'omegaconf',
    'h5py',                 # stable_marl.data: the hdf5 dataset format
    'networkx',             # stable_marl.envs.rware (RWARE's collision resolution)
]

[project.optional-dependencies]
pettingzoo = ['pettingzoo']
torchrl = ['pettingzoo', 'torch', 'torchrl>=0.10,<0.12']
train = ['torch']           # reading datasets as tensors (stable_marl.data.Dataset), FeedForwardPolicy
rllib = ['ray[rllib]']
gcrl = ['jax', 'flax', 'optax', 'distrax', 'ml_collections']   # stable_marl.wm.gcrl: MangoBench's JAX baselines
vmas = ['vmas']             # the VMAS environments (GPL-3.0, not vendored)
robofactory = ['mani_skill>=3.0.1', 'huggingface_hub']   # stable_marl.envs.robofactory; its expert (mplib 0.1.1) needs numpy<2
render = [                  # GridRecorder videos / frames, dataset videos, plotting in tests and examples
    'pillow>=11.3.0',
    'moviepy==1.0.3',
    'imageio',
    'imageio-ffmpeg',
    'opencv-python',
    'tqdm',
    'matplotlib',
]
dev = [                     # nbdev: `pip install -e ".[dev]"`
    'pettingzoo',
    'torch',
    'torchrl>=0.10,<0.12',
    'ray[rllib]',
    'vmas',
    'pillow>=11.3.0',
    'moviepy==1.0.3',
    'imageio',
    'imageio-ffmpeg',
    'opencv-python',
    'tqdm',
    'matplotlib',
    'nbdev',
    'notebook',
    'jupyterlab',
    'ipywidgets',
    'jupyterlab-git',
    'ipdb',
]

[project.urls]
Repository = "https://github.com/Ahmed-Khaled-Saleh/stable-marl"
Documentation = "https://Ahmed-Khaled-Saleh.github.io/stable-marl/"

[project.entry-points.nbdev]
stable_marl = "stable_marl._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "stable_marl.__version__"}

[tool.setuptools.packages.find]
include = ["stable_marl*"]

[tool.setuptools.package-data]
stable_marl = ["configs/**/*.yaml", "envs/robofactory/upstream/configs/**/*.yaml"]

[tool.nbdev]
branch = "master"
