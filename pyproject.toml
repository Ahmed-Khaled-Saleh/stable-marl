[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "multigrid"
dynamic = ["version"]
description = "Fast and flexible multi-agent gridworld reinforcement learning environments."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Ahmed-Khaled-Saleh", email = "ahmedkhaledsaleh11@gmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    'aenum',
    'numpy',
    'numba',
    'fastcore',
    'gymnasium',
    'pygame',
    'hydra-core',           # multigrid.configs, multigrid.utils.env_factory
    'omegaconf',
]

[project.optional-dependencies]
pettingzoo = ['pettingzoo']
torchrl = ['pettingzoo', 'torch', 'torchrl>=0.10,<0.12']
rllib = ['ray[rllib]']
render = [                  # GridRecorder videos / frames, plotting in tests and examples
    'pillow>=11.3.0',
    'moviepy==1.0.3',
    'opencv-python',
    'tqdm',
    'matplotlib',
]
dev = [                     # nbdev: `pip install -e ".[dev]"`
    'pettingzoo',
    'torch',
    'torchrl>=0.10,<0.12',
    'ray[rllib]',
    'pillow>=11.3.0',
    'moviepy==1.0.3',
    'opencv-python',
    'tqdm',
    'matplotlib',
    'nbdev',
    'notebook',
    'jupyterlab',
    'ipywidgets',
    'jupyterlab-git',
    'ipdb',
]

[project.urls]
Repository = "https://github.com/Ahmed-Khaled-Saleh/multigrid"
Documentation = "https://Ahmed-Khaled-Saleh.github.io/multigrid/"

[project.entry-points.nbdev]
multigrid = "multigrid._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "multigrid.__version__"}

[tool.setuptools.packages.find]
include = ["multigrid*"]

[tool.setuptools.package-data]
multigrid = ["configs/**/*.yaml"]

[tool.nbdev]
